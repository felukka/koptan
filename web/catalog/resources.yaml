  name: koptan-container-registry
  title: Koptan Container Registry
  description: Container registry used for Koptan and application images.
  annotations:
    koptan.dev/resource-kind: container-registry
spec:
  type: container-registry
  lifecycle: experimental
  owner: platform-team
  system: koptan
