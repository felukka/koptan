  title: Kubernetes API
  description: Kubernetes API used by the Koptan operator.
  annotations:
    koptan.dev/resource-kind: kubernetes-api
spec:
  type: kubernetes-cluster
  lifecycle: production
  owner: platform-team
  system: koptan
