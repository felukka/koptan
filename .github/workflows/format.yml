---
name: Format
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3.24.2
      - name: Check formatting
        run: |-
          unformatted="$(nix develop --command gofumpt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::The following files are not formatted with gofumpt:"
            echo "$unformatted"
            echo "Fix with: nix develop --command gofumpt -w ."
            exit 1
          fi
