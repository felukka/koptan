---
name: Agent Tests
on:
  push:
    branches:
      - main
    paths:
      - agent/**
  pull_request:
    paths:
      - agent/**
jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Running Tests
        run: make agent-test
