---
name: Tests
on:
  push:
    branches:
      - main
    paths:
      - internal/**
      - api/**
      - cmd/**
      - go.mod
      - go.sum
  pull_request:
    paths:
      - internal/**
      - api/**
      - cmd/**
      - go.mod
      - go.sum
jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Running Tests
        run: |-
          go mod tidy
          make test
