---
name: Release Pipeline
on:
  push:
    tags:
      - v*.*.*
permissions:
  contents: read
jobs:
  images:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: operator
            context: .
            image: ghcr.io/felukka/koptan
          - name: agent
            context: agent
            image: ghcr.io/felukka/koptan-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 is published as 1.2.3, 1.2 and latest; 1.2.3 matches the chart appVersion.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  # The Backstage image packs a host build (packages/backend/dist), so it builds outside the matrix.
  ui-image:
    name: image (ui)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build backend bundle
        working-directory: web
        run: |-
          corepack enable
          yarn install --immutable
          yarn tsc
          yarn build:backend
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/felukka/koptan-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/packages/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
  release:
    name: release
    needs: [images, ui-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
  # Opens a "[koptan] ..." and a "[koptan-ui] ..." PR in felukka/charts (the charts CI allows
  # one chart per PR) with the new CRDs, RBAC and appVersion.
  # Uses a GitHub App installed on felukka/charts (contents and pull-requests write),
  # from the CHARTS_APP_ID and CHARTS_APP_PRIVATE_KEY secrets.
  chart-sync:
    name: chart sync
    needs: [images, ui-image]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Charts token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CHARTS_APP_ID }}
          private-key: ${{ secrets.CHARTS_APP_PRIVATE_KEY }}
          owner: felukka
          repositories: charts
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout charts
        uses: actions/checkout@v6
        with:
          repository: felukka/charts
          token: ${{ steps.app-token.outputs.token }}
          path: charts
      - name: Version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Sync koptan chart
        run: hack/sync-chart.sh charts/charts/koptan "${{ steps.version.outputs.version }}"
      - name: Open koptan pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: charts
          add-paths: charts/koptan
          token: ${{ steps.app-token.outputs.token }}
          branch: koptan/sync-${{ steps.version.outputs.version }}
          commit-message: '[koptan] sync with koptan ${{ steps.version.outputs.version }}'
          title: '[koptan] sync with koptan ${{ steps.version.outputs.version }}'
          body: |-
            Syncs `charts/koptan` with koptan [${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}):

            - CRDs from `config/crd/bases`
            - ClusterRole rules from `config/rbac/role.yaml` and `config/rbac/backstage_role.yaml`
            - `appVersion` set to `${{ steps.version.outputs.version }}`, chart `version` bumped

            Review any new manager flags or env vars in `cmd/main.go` by hand; they are not synced.
      - name: Sync koptan-ui chart
        run: hack/sync-chart.sh charts/charts/koptan-ui "${{ steps.version.outputs.version }}"
      - name: Open koptan-ui pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: charts
          add-paths: charts/koptan-ui
          token: ${{ steps.app-token.outputs.token }}
          branch: koptan-ui/sync-${{ steps.version.outputs.version }}
          commit-message: '[koptan-ui] sync with koptan ${{ steps.version.outputs.version }}'
          title: '[koptan-ui] sync with koptan ${{ steps.version.outputs.version }}'
          body: |-
            Syncs `charts/koptan-ui` with koptan [${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}):

            - ClusterRole rules from `config/rbac/backstage_role.yaml`
            - `appVersion` set to `${{ steps.version.outputs.version }}` (image `ghcr.io/felukka/koptan-ui`), chart `version` bumped

            Review new `web/app-config.yaml` settings by hand; they are not synced.
