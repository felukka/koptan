---
name: Release Pipeline
on:
  push:
    tags:
      - v*.*.*
  # Releases the selected branch's head as a new tag (Actions → Release Pipeline → Run workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create from the selected branch, e.g. v1.2.3
        required: true
        type: string
permissions:
  contents: read
jobs:
  # The tag comes from the pushed ref or, on a manual run, from the input. A manual run may
  # reuse an existing tag only when it points at the same commit (re-running a failed release).
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |-
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag \"$TAG\" is not of the form vX.Y.Z"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # An annotated tag lists its tag object and the commit (the "^{}" line); use the commit.
            refs="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
            existing="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"$refs")"
            existing="${existing:-$(cut -f1 <<<"$refs")}"
            if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
              echo "::error::tag $TAG already exists at $existing, not at $GITHUB_SHA"
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  images:
    name: image (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: operator
            context: .
            image: ghcr.io/felukka/koptan
          - name: agent
            context: agent
            image: ghcr.io/felukka/koptan-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 is published as 1.2.3, 1.2 and latest; 1.2.3 matches the chart appVersion.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  # The Backstage image packs a host build (packages/backend/dist), so it builds outside the matrix.
  ui-image:
    name: image (ui)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build backend bundle
        working-directory: web
        run: |-
          corepack enable
          yarn install --immutable
          yarn tsc
          yarn build:backend
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/felukka/koptan-ui
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/packages/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
  release:
    name: release
    needs: [version, images, ui-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          # Creates the tag on a manual run; on a tag push it is that tag's commit.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
  # Opens a "[koptan] ..." and a "[koptan-ui] ..." PR in felukka/charts (the charts CI allows
  # one chart per PR) with the new CRDs, RBAC and appVersion.
  # Uses the CHARTS_TOKEN secret when set (a personal token with public_repo), otherwise a
  # GitHub App installed on felukka/charts (contents and pull-requests write), from the
  # CHARTS_APP_ID and CHARTS_APP_PRIVATE_KEY secrets.
  chart-sync:
    name: chart sync
    needs: [version, images, ui-image]
    runs-on: ubuntu-latest
    env:
      CHARTS_TOKEN: ${{ secrets.CHARTS_TOKEN }}
    steps:
      - name: Charts token
        id: app-token
        if: env.CHARTS_TOKEN == ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CHARTS_APP_ID }}
          private-key: ${{ secrets.CHARTS_APP_PRIVATE_KEY }}
          owner: felukka
          repositories: charts
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout charts
        uses: actions/checkout@v6
        with:
          repository: felukka/charts
          token: ${{ env.CHARTS_TOKEN || steps.app-token.outputs.token }}
          path: charts
      - name: Sync koptan chart
        run: hack/sync-chart.sh charts/charts/koptan "${{ needs.version.outputs.version }}"
      - name: Open koptan pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: charts
          add-paths: charts/koptan
          token: ${{ env.CHARTS_TOKEN || steps.app-token.outputs.token }}
          branch: koptan/sync-${{ needs.version.outputs.version }}
          commit-message: '[koptan] sync with koptan ${{ needs.version.outputs.version }}'
          title: '[koptan] sync with koptan ${{ needs.version.outputs.version }}'
          body: |-
            Syncs `charts/koptan` with koptan [${{ needs.version.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}):

            - CRDs from `config/crd/bases`
            - ClusterRole rules from `config/rbac/role.yaml` and `config/rbac/backstage_role.yaml`
            - `appVersion` set to `${{ needs.version.outputs.version }}`, chart `version` bumped

            Review any new manager flags or env vars in `cmd/main.go` by hand; they are not synced.
      - name: Sync koptan-ui chart
        run: hack/sync-chart.sh charts/charts/koptan-ui "${{ needs.version.outputs.version }}"
      - name: Open koptan-ui pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: charts
          add-paths: charts/koptan-ui
          token: ${{ env.CHARTS_TOKEN || steps.app-token.outputs.token }}
          branch: koptan-ui/sync-${{ needs.version.outputs.version }}
          commit-message: '[koptan-ui] sync with koptan ${{ needs.version.outputs.version }}'
          title: '[koptan-ui] sync with koptan ${{ needs.version.outputs.version }}'
          body: |-
            Syncs `charts/koptan-ui` with koptan [${{ needs.version.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}):

            - ClusterRole rules from `config/rbac/backstage_role.yaml`
            - `appVersion` set to `${{ needs.version.outputs.version }}` (image `ghcr.io/felukka/koptan-ui`), chart `version` bumped

            Review new `web/app-config.yaml` settings by hand; they are not synced.
